name: GOD ATOM macOS universal
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure universal
        run: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DGODATOM_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release --parallel 4 -- -quiet
      - name: Engine tests
        shell: bash
        run: |
          set -o pipefail
          ./build/Release/godatom_engine_tests 2>&1 | tee engine-test-log.txt
      - name: Plugin tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p shots && cd shots
          ../build/godatom_plugin_tests_artefacts/Release/godatom_plugin_tests 2>&1 | tee ../plugin-test-log.txt
      - name: Strip, sign, verify universal
        shell: bash
        run: |
          set -e
          b="build/GodAtom_artefacts/Release/VST3/GOD ATOM.vst3"
          bin="$b/Contents/MacOS/GOD ATOM"
          strip -x "$bin"
          codesign --force --deep --sign - --timestamp=none "$b"
          codesign --verify --deep --strict "$b"
          lipo -info "$bin" | tee lipo.txt
          lipo "$bin" -verify_arch arm64 x86_64
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$b/Contents/Info.plist" | tee version.txt
      - name: pluginval VST3 strictness 10 (required)
        shell: bash
        run: |
          set -o pipefail
          curl -fLsS -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --validate-in-process --timeout-ms 600000 "build/GodAtom_artefacts/Release/VST3/GOD ATOM.vst3" 2>&1 | tee pluginval-vst3-log.txt
          grep -q "SUCCESS" pluginval-vst3-log.txt || { echo "pluginval did not report SUCCESS"; exit 1; }
          if grep -q "FAILED" pluginval-vst3-log.txt; then echo "pluginval reported FAILED"; exit 1; fi
      - name: Package
        if: success()
        run: |
          mkdir -p "pkg/GOD ATOM"
          cp -R "build/GodAtom_artefacts/Release/VST3/GOD ATOM.vst3" "pkg/GOD ATOM/"
          cp README.md TESTING.md LICENSE "pkg/GOD ATOM/"
          cd pkg && zip -9 -r -y -q "$GITHUB_WORKSPACE/GODATOM-macOS-universal-v1.0.0.zip" "GOD ATOM"
          shasum -a 256 "$GITHUB_WORKSPACE/GODATOM-macOS-universal-v1.0.0.zip" | tee "$GITHUB_WORKSPACE/sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GODATOM-macOS-universal-v1.0.0
          path: |
            GODATOM-macOS-universal-v1.0.0.zip
            shots/*.png
            shots/diag/*
            engine-test-log.txt
            plugin-test-log.txt
            pluginval-vst3-log.txt
            sha256.txt
            lipo.txt
            version.txt
